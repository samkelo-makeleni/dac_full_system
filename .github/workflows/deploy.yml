name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Skipping Supabase function deployment; SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not configured."
            exit 0
          fi

          supabase functions deploy parse-report --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy generate-dac --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy delete-report --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy delete-all-reports --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy delete-dac --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
