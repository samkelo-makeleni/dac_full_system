name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Supabase Edge Functions
        run: |
          deno lint --rules-exclude=no-explicit-any supabase/functions

      - name: Validate required SQL files
        run: |
          test -s sql/schema.sql
          test -s sql/storage_policies.sql
          test -s sql/schedule_cron.sql

      - name: Validate frontend entrypoint
        run: |
          test -s frontend/index.html
          grep -q "Falcorp DAC Portal" frontend/index.html
          grep -q "createClient" frontend/index.html
